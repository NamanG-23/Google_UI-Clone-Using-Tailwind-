<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google UI clone</title>
</head>

<body class="bg-white flex flex-col min-h-screen">
  <header class="flex justify-between text-[14px]">
    <div class="flex p-4 text-center justify-start">
      <div class="flex space-x-4">
        <a href="" class="text-gray-900 hover:underline">About</a>
        <a href="" class="text-gray-900 hover:underline">Store</a>
      </div>
    </div>
    
    <div class="flex p-4 text-center justify-start">
      <div class="flex space-x-4 items-center">
        <a href="" class="text-gray-900 hover:underline">Gmail</a>
        <a href="" class="text-gray-900 hover:underline">Images</a>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#434343">
          <circle cx="240" cy="-720" r="70"/>
          <circle cx="480" cy="-720" r="70"/>
          <circle cx="720" cy="-720" r="70"/>
          <circle cx="240" cy="-480" r="70"/>
          <circle cx="480" cy="-480" r="70"/>
          <circle cx="720" cy="-480" r="70"/>
          <circle cx="240" cy="-240" r="70"/>
          <circle cx="480" cy="-240" r="70"/>
          <circle cx="720" cy="-240" r="70"/>
        </svg>
        <div class="bg-amber-400 text-gray-900 rounded-full w-8 h-8 flex items-center justify-center">NG</div>
      </div>
    </div>
  </header>
  <main class="flex-1 flex flex-col items-center mt-24 px-4">
    <h1 class="text-[80px] font-bold">
      <span class="text-[#4285f4]">G</span><span class="text-[#ea4335]">o</span><span class="text-[#fbbc05]">o</span><span class="text-[#4285f4]">g</span><span class="text-[#34a853]">l</span><span class="text-[#ea4335]">e</span>
    </h1>
    <div class="flex items-center border border-gray-300 rounded-full w-full max-w-[580px] px-4 py-3 mt-6 hover:shadow-md">
  <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2">
    <circle cx="10" cy="10" r="7"/>
    <line x1="15" y1="15" x2="21" y2="21"/>
  </svg>
  <input type="text" class="flex-1 mx-3 outline-none" placeholder="Search Google or type a URL">
  <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 24 24" fill="#4285f4">
    <rect x="9" y="2" width="6" height="12" rx="3"/>
    <path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="#34a853" stroke-width="2"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="#fbbc05" stroke-width="2"/>
  </svg>
</div>
    <div class="flex space-x-4 mt-8 text-[14px]">
      <button class="bg-gray-100 text-gray-800 px-4 py-2 rounded hover:border hover:border-gray-300">Google Search</button>
      <button class="bg-gray-100 text-gray-800 px-4 py-2 rounded hover:border hover:border-gray-300">I'm Feeling Lucky</button>
    </div>
    <p class="mt-8 text-[14px] text-gray-700">
      Google offered in:
      <a href="" class="text-blue-700 hover:underline ml-1">हिन्दी</a>
      <a href="" class="text-blue-700 hover:underline ml-1">বাংলা</a>
      <a href="" class="text-blue-700 hover:underline ml-1">తెలుగు</a>
      <a href="" class="text-blue-700 hover:underline ml-1">मराठी</a>
      <a href="" class="text-blue-700 hover:underline ml-1">தமிழ்</a>
    </p>
  </main>
  
  <footer class="bg-gray-100 text-[14px] text-gray-600">
    
    <div class="p-4 border-b border-gray-300">India</div>
    
    <div class="flex justify-between p-4">
      <div class="flex space-x-4">
        <a href="" class="hover:underline">Advertising</a>
        <a href="" class="hover:underline">Business</a>
        <a href="" class="hover:underline">How Search works</a>
      </div>
      <div class="flex space-x-4">
        <a href="" class="hover:underline">Privacy</a>
        <a href="" class="hover:underline">Terms</a>
        <a href="" class="hover:underline">Settings</a>
      </div>
    </div>
  </footer>
</body>
</html>
